<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu Perfil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 1.2rem;
            color: #e87c3e;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .profile-card {
            background-color: #1a1a1a;
            border: 2px solid #2a2a2a;
            border-radius: 16px;
            padding: 25px 15px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            border-color: #e87c3e;
            box-shadow: 0 8px 20px rgba(232, 124, 62, 0.15);
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: #050505;
            margin-bottom: 15px;
        }

        .profile-name {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            word-break: break-word;
        }

        /* Tarjeta para agregar nuevo perfil */
        .add-profile-card {
            background-color: transparent;
            border: 2px dashed #444;
        }
        
        .add-profile-card:hover {
            border-color: #e87c3e;
            background-color: rgba(232, 124, 62, 0.05);
        }

        .add-avatar {
            background: #2a2a2a;
            color: #888;
        }

        .add-profile-card:hover .add-avatar {
            background: #e87c3e;
            color: #050505;
        }

        .add-name {
            color: #888;
        }

        .add-profile-card:hover .add-name {
            color: #e87c3e;
        }

        /* Modal para nuevo usuario */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background-color: #1a1a1a;
            border: 1px solid #e87c3e;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-title {
            color: #e87c3e;
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            background-color: #050505;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        .modal-input:focus {
            outline: none;
            border-color: #e87c3e;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #050505;
            border: 1px solid #444;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .color-picker-container label {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            font-weight: 700;
        }

        .color-picker-container input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .color-picker-container input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-container input[type="color"]::-webkit-color-swatch {
            border: 2px solid #fff;
            border-radius: 50%;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-cancel, .btn-save {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-family: 'Montserrat', sans-serif;
            transition: background 0.2s;
        }

        .btn-cancel {
            background-color: #2a2a2a;
            color: #ccc;
        }
        .btn-cancel:hover { background-color: #333; color: #fff; }

        .btn-save {
            background-color: #e87c3e;
            color: #050505;
        }
        .btn-save:hover { background-color: #ff8c4a; }
        
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #888;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .delete-btn:hover { color: #ff4444; background: rgba(255, 68, 68, 0.1); }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo">MY FITNESS APP</div>
        <h1>¿Quién entrena hoy?</h1>

        <div class="profiles-grid" id="profilesGrid"></div>
    </div>

    <!-- Modal Nuevo Perfil -->
    <div class="modal-overlay" id="newProfileModal">
        <div class="modal-box">
            <h3 class="modal-title">Crear Nuevo Perfil</h3>
            <input type="text" id="profileNameInput" class="modal-input" placeholder="Nombre del usuario" maxlength="15">
            
            <div class="color-picker-container">
                <label for="profileColorInput">Color de Interfaz:</label>
                <input type="color" id="profileColorInput" value="#e87c3e">
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-save" onclick="saveNewProfile()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const MAX_PROFILES = 5;
        let profiles = [];

        try {
            const saved = localStorage.getItem('app_profiles');
            profiles = saved ? JSON.parse(saved) : [];
            if (!Array.isArray(profiles)) profiles = [];
        } catch (e) {
            profiles = [];
        }

        const profilesGrid = document.getElementById('profilesGrid');
        const modal = document.getElementById('newProfileModal');
        const nameInput = document.getElementById('profileNameInput');
        const colorInput = document.getElementById('profileColorInput');

        function renderProfiles() {
            if (!profilesGrid) return;
            profilesGrid.innerHTML = '';

            profiles.forEach(profile => {
                const initial = profile.name ? profile.name.charAt(0).toUpperCase() : 'U';
                const profileColor = profile.themeColor || '#e87c3e';
                
                const card = document.createElement('div');
                card.className = 'profile-card';
                card.onclick = () => selectProfile(profile.id);

                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteProfile('${profile.id}', event)" title="Eliminar perfil">✕</button>
                    <div class="avatar" style="background: linear-gradient(135deg, ${profileColor} 0%, #ffffff 100%);">${initial}</div>
                    <div class="profile-name">${profile.name}</div>
                `;
                profilesGrid.appendChild(card);
            });

            if (profiles.length < MAX_PROFILES) {
                const addCard = document.createElement('div');
                addCard.className = 'profile-card add-profile-card';
                addCard.onclick = openModal;
                addCard.innerHTML = `
                    <div class="avatar add-avatar">+</div>
                    <div class="profile-name add-name">Añadir Perfil</div>
                `;
                profilesGrid.appendChild(addCard);
            }
        }

        function openModal() {
            if (nameInput) nameInput.value = '';
            if (colorInput) colorInput.value = '#e87c3e';
            if (modal) modal.style.display = 'flex';
            if (nameInput) nameInput.focus();
        }

        function closeModal() {
            if (modal) modal.style.display = 'none';
        }

        function saveNewProfile() {
            const name = nameInput ? nameInput.value.trim() : '';
            const themeColor = colorInput ? colorInput.value : '#e87c3e';

            if (name === '') {
                alert('Por favor ingresa un nombre.');
                return;
            }

            const newProfile = {
                id: 'user_' + Date.now(),
                name: name,
                themeColor: themeColor
            };

            profiles.push(newProfile);
            try {
                localStorage.setItem('app_profiles', JSON.stringify(profiles));
            } catch (e) {}
            
            closeModal();
            renderProfiles();
        }

        function selectProfile(profileId) {
            try {
                localStorage.setItem('active_profile_id', profileId);
            } catch (e) {}
            window.location.href = 'dashboard.html';
        }

        function deleteProfile(profileId, event) {
            event.stopPropagation();
            
            if(confirm('¿Estás seguro de que deseas eliminar este perfil y todos sus datos?')) {
                profiles = profiles.filter(p => p.id !== profileId);
                try {
                    localStorage.setItem('app_profiles', JSON.stringify(profiles));
                    if(localStorage.getItem('active_profile_id') === profileId) {
                        localStorage.removeItem('active_profile_id');
                    }
                } catch (e) {}
                
                renderProfiles();
            }
        }

        renderProfiles();
    </script>
</body>
</html>
