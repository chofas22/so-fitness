<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina - Fitness App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            max-width: 450px;
            width: 100%;
        }

        .back-btn {
            display: inline-block;
            color: #e87c3e;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px 0;
            border-bottom: 1px solid #222;
        }

        .header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 5px 0 0 0;
            color: #e87c3e;
            text-transform: uppercase;
        }

        .action-buttons-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .btn-trainer {
            background: linear-gradient(135deg, #e87c3e 0%, #ff9e5e 100%);
            color: #050505;
        }

        .btn-add {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
        }

        .action-btn:hover {
            transform: scale(1.02);
        }

        .section-title {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            margin: 25px 0 15px 0;
            border-left: 4px solid #e87c3e;
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ESTILOS DE LA TARJETA TIPO ACORDEÓN */
        .exercise-card {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .exercise-card:hover {
            border-color: #e87c3e;
        }

        .card-title {
            color: #e87c3e;
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0 0 4px 0;
            text-transform: uppercase;
        }

        .card-subtitle {
            font-size: 0.82rem;
            color: #d1d1d1;
            margin: 0 0 6px 0;
        }

        .card-details {
            font-size: 0.75rem;
            color: #ffa726;
            text-transform: uppercase;
            font-weight: 700;
            margin: 0;
        }

        .card-hidden-content {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #383838;
        }

        .exercise-card.active .card-hidden-content {
            display: block;
        }

        .exercise-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: #111;
            border: 1px solid #444;
        }

        .card-instructions {
            font-size: 0.82rem;
            color: #ccc;
            line-height: 1.4;
            margin: 0;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            border-top: 1px solid #383838;
            padding-top: 12px;
        }

        .btn-small {
            background: none;
            border: none;
            color: #888;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            padding: 0;
            letter-spacing: 0.5px;
        }

        .btn-small:hover { color: #e87c3e; }
        .btn-delete:hover { color: #ff4444; }

        /* Modal Formulario */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-box {
            background-color: #1a1a1a;
            border: 1px solid #e87c3e;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #e87c3e;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            background-color: #050505;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .form-control:focus { outline: none; border-color: #e87c3e; }

        .input-group-flex {
            display: flex;
            gap: 10px;
