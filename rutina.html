<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina - Fitness App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

        :root {
            --primary-color: #e87c3e; /* Se actualiza dinámicamente según el perfil */
            --primary-gradient: linear-gradient(135deg, var(--primary-color) 0%, color-mix(in srgb, var(--primary-color) 60%, white 40%) 100%);
            --bg-color: #050505;
            --card-bg: #1a1a1a;
            --card-inner: #2a2a2a;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            max-width: 450px;
            width: 100%;
        }

        .back-btn {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px 0;
            border-bottom: 1px solid #222;
        }

        .header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 5px 0 0 0;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        /* BANNER DE RACHA */
        .streak-banner {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a1a10 100%);
            border: 1px solid var(--primary-color);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(232, 124, 62, 0.15);
        }

        .streak-info span {
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
        }

        .streak-info h4 {
            margin: 2px 0 0 0;
            font-size: 1rem;
            color: var(--primary-color);
            font-weight: 800;
        }

        .streak-badge {
            font-size: 1.5rem;
        }

        .action-buttons-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .btn-trainer {
            background: var(--primary-gradient);
            color: #050505;
        }

        .btn-add {
            background-color: var(--card-inner);
            color: #fff;
            border: 1px solid #444;
        }

        .action-btn:hover {
            transform: scale(1.02);
        }

        .section-title {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            margin: 25px 0 15px 0;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ESTILOS DE LA TARJETA TIPO ACORDEÓN */
        .exercise-card {
            background-color: var(--card-inner);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .exercise-card:hover {
            border-color: var(--primary-color);
        }

        .card-title {
            color: var(--primary-color);
            font-size: 1.05rem;
            font-weight: 700;
            margin: 0 0 4px 0;
            text-transform: uppercase;
        }

        .card-subtitle {
            font-size: 0.82rem;
            color: #d1d1d1;
            margin: 0 0 6px 0;
        }

        .card-details {
            font-size: 0.75rem;
            color: var(--primary-color);
            text-transform: uppercase;
            font-weight: 700;
            margin: 0;
        }

        .card-hidden-content {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #383838;
        }

        .exercise-card.active .card-hidden-content {
            display: block;
        }

        .exercise-img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: #111;
            border: 1px solid #444;
        }

        .card-instructions {
            font-size: 0.82rem;
            color: #ccc;
            line-height: 1.4;
            margin: 0;
        }

        .card-actions {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            border-top: 1px solid #383838;
            padding-top: 12px;
        }

        .btn-small {
            background: none;
            border: none;
            color: #888;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            padding: 0;
            letter-spacing: 0.5px;
        }

        .btn-small:hover { color: var(--primary-color); }
        .btn-delete:hover { color: #ff4444; }

        /* Modal Formulario */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-box {
            background-color: var(--card-bg);
            border: 1px solid var(--primary-color);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            background-color: #050505;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .form-control:focus { outline: none; border-color: var(--primary-color); }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #fff;
            font-weight: 600;
            margin-top: 10px;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .input-group-flex {
            display: flex;
            gap: 10px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel, .btn-save {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }

        .btn-cancel { background-color: var(--card-inner); color: #ccc; }
        .btn-save { background-color: var(--primary-color); color: #050505; }

        /* Estilos Modo Entrenador */
        #trainer-mode-container {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--primary-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            margin-bottom: 25px;
        }

        .trainer-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .trainer-counter {
            font-size: 0.8rem;
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
        }

        .exit-trainer-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .trainer-nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .nav-step-btn {
            flex: 1;
            background-color: var(--card-inner);
            color: #fff;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }

        .nav-step-btn.primary {
            background-color: var(--primary-color);
            color: #050505;
            border-color: var(--primary-color);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            border: 2px dashed #333;
            border-radius: 12px;
            margin-top: 20px;
        }

        /* --- TEMPORIZADOR FLOTANTE --- */
        #timer-bubble {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: var(--primary-color);
            color: #050505;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(232, 124, 62, 0.4);
            cursor: pointer;
            z-index: 9999;
            transition: transform 0.2s ease;
        }
        #timer-bubble:hover { transform: scale(1.08); }
        #timer-bubble svg { width: 26px; height: 26px; fill: #050505; }

        #timer-modal {
            position: fixed;
            bottom: 95px;
            right: 20px;
            max-width: 360px;
            width: calc(100% - 40px);
            background-color: var(--card-bg);
            border: 1px solid var(--primary-color);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            z-index: 10000;
            display: none;
            color: #fff;
            box-sizing: border-box;
        }

        .timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .timer-header h3 { margin: 0; font-size: 0.95rem; color: var(--primary-color); text-transform: uppercase; }
        .close-timer { background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; padding: 0; width: auto; }
        .close-timer:hover { color: #fff; }

        .timer-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 12px;
            background-color: #111;
            padding: 4px;
            border-radius: 8px;
        }
        .timer-tab {
            flex: 1; background: none; border: none; color: #888; padding: 8px;
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase; cursor: pointer;
            border-radius: 6px; font-family: 'Montserrat', sans-serif; transition: all 0.2s;
        }
        .timer-tab.active { background-color: var(--primary-color); color: #050505; }

        .timer-inputs-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .timer-row {
            display: flex; justify-content: space-between; align-items: center;
            background-color: #111; padding: 8px 12px; border-radius: 8px; border: 1px solid #333;
        }
        .timer-row label { font-size: 0.75rem; color: #ccc; text-transform: uppercase; font-weight: 700; }
        .timer-input-wrapper { display: flex; align-items: center; gap: 6px; }
        .timer-row input, .timer-row select {
            background-color: #1a1a1a; border: 1px solid #444; border-radius: 6px; color: #fff; font-family: 'Montserrat', sans-serif;
        }
        .timer-row input { width: 55px; padding: 6px; text-align: center; font-size: 0.9rem; }
        .timer-row select { padding: 6px; font-size: 0.8rem; cursor: pointer; }

        .timer-display {
            text-align: center; background-color: #111; border: 2px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 12px;
        }
        .timer-status { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--primary-color); margin-bottom: 4px; font-weight: 700; }
        .timer-clock { font-size: 2.2rem; font-weight: 800; color: #ffffff; margin: 0; }
        .timer-rounds-info { font-size: 0.75rem; color: #888; margin-top: 4px; text-transform: uppercase; }

        .timer-actions { display: flex; gap: 8px; }
        .timer-btn {
            padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center;
        }
        .timer-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .btn-main { background-color: var(--primary-color); color: #050505; flex: 1; }
        .btn-reset-icon { background-color: var(--card-inner); border: 1px solid #444; color: #fff; width: 48px; flex-shrink: 0; border-radius: 8px; }

        /* TABLA Y GRÁFICA DE PROGRESO */
        .progress-section {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-top: 25px;
        }
        .progress-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; text-align: left; margin-bottom: 15px; }
        .progress-table th { color: var(--primary-color); border-bottom: 1px solid #444; padding-bottom: 8px; font-size: 0.68rem; text-transform: uppercase; }
        .progress-table td { padding: 8px 0; border-bottom: 1px solid #222; color: #ccc; }
        .progress-table tr:hover td { background-color: rgba(232, 124, 62, 0.05); }

        .chart-container {
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .chart-title {
            font-size: 0.75rem;
            color: var(--primary-color);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 10px;
        }
        canvas {
            width: 100% !important;
            height: 140px !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <a href="dashboard.html" class="back-btn">← Volver a la semana</a>

        <div class="header">
            <h2 id="profileHeaderName">USUARIO</h2>
            <h1 id="dayHeaderTitle">RUTINA</h1>
        </div>

        <!-- BANNER DE RACHAS -->
        <div class="streak-banner">
            <div class="streak-info">
                <span>Racha de Entrenamiento</span>
                <h4 id="streakText">¡0 días seguidos!</h4>
            </div>
            <div class="streak-badge">🔥</div>
        </div>

        <div class="action-buttons-grid">
            <button class="action-btn btn-trainer" id="btnStartTrainer">
