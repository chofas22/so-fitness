<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Semana - Fitness App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

        :root {
            --primary-color: #e87c3e; /* Se actualiza dinámicamente según el perfil */
            --bg-color: #050505;
            --card-inner: #2a2a2a;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            max-width: 450px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
        }

        .welcome-text {
            margin: 0;
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .greeting {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 5px 0 0 0;
            text-transform: uppercase;
        }

        /* ESTILO DEL BOTÓN DE PERFIL EN CÍRCULO */
        .btn-profile { 
            background: none; 
            border: 1px solid #444; 
            color: #fff; 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .btn-profile:hover { 
            border-color: var(--primary-color); 
            color: var(--primary-color); 
            background-color: rgba(255, 255, 255, 0.05);
        }
        .btn-profile svg { 
            width: 22px; 
            height: 22px; 
            fill: currentColor; 
        }

        .actions-top-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        /* BOTÓN DE CONFIGURAR DÍAS CON VECTOR */
        .action-top-btn {
            flex: 1;
            background-color: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* Espacio entre el ícono y el texto */
        }
        .action-top-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .action-top-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: rgba(232, 124, 62, 0.05);
        }

        .section-title {
            font-size: 1rem;
            margin-bottom: 20px;
            font-weight: 700;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px 20px 30px 20px;
            margin-bottom: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .day-card:hover {
            border-color: var(--primary-color);
            transform: translateX(5px);
        }

        .day-info h3 {
            margin: 0 0 4px 0;
            font-size: 1.6rem;
            color: #fff;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .day-info p {
            margin: 0;
            font-size: 0.75rem;
            color: #888;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-action {
            position: absolute;
            bottom: 15px;
            right: 20px;
            color: var(--primary-color);
            font-weight: 900;
            font-size: 1.3rem;
            line-height: 1;
        }

        .delete-day-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.3);
            color: #ff4444;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.9rem;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
            padding: 0;
        }
        .delete-day-btn:hover {
            background-color: #ff4444;
            color: #fff;
            border-color: #ff4444;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            border: 2px dashed #333;
            border-radius: 12px;
            margin-top: 20px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-box {
            background-color: #1a1a1a;
            border: 1px solid var(--primary-color);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .day-config-row {
            background-color: #050505;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .day-config-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary-color);
            cursor: pointer;
        }

        .day-config-header input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .form-control {
            width: 100%;
            background-color: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        .form-control:focus { outline: none; border-color: var(--primary-color); }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel, .btn-save {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }

        .btn-cancel { background-color: #2a2a2a; color: #ccc; }
        .btn-save { background-color: var(--primary-color); color: #050505; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Cabecera dinámica -->
        <div class="header">
            <div>
                <p class="welcome-text">Entrenando hoy</p>
                <h1 class="greeting" id="userName">Usuario</h1>
            </div>
            <!-- Botón de perfil circular -->
            <button class="btn-profile" onclick="logout()" title="Cambiar Perfil">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </button>
        </div>

        <!-- Botón para configurar los días que entrena con ícono vectorizado -->
        <div class="actions-top-grid">
            <button class="action-top-btn" onclick="openConfigModal()">
                <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                Configurar Mis Días
            </button>
        </div>

        <h2 class="section-title">Tu Semana de Entrenamiento</h2>
        
        <!-- Contenedor de los días activos -->
        <div id="weekDaysList">
            <!-- Se inyectan con JavaScript -->
        </div>
        <div id="emptyState" class="empty-state" style="display:none;">
            <p style="margin:0; font-size:0.9rem;">No tienes días de entrenamiento configurados.</p>
            <p style="margin:5px 0 0 0; font-size:0.8rem; color:#888;">Toca "Configurar Mis Días" para armar tu rutina.</p>
        </div>
    </div>

    <!-- MODAL CONFIGURACIÓN DE DÍAS -->
    <div class="modal-overlay" id="configModal">
        <div class="modal-box">
            <h3 style="color:var(--primary-color); margin-top:0; text-transform:uppercase; font-size:1.1rem;">Personalizar Tus Días</h3>
            <p style="font-size:0.75rem; color:#888; margin-bottom:15px;">Selecciona los días que entrenas y ponle un subtítulo a cada uno.</p>
            
            <div id="daysConfigContainer">
                <!-- Se generan dinámicamente los 7 días de la semana -->
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeConfigModal()">Cancelar</button>
                <button class="btn-save" onclick="saveUserSchedule()">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script>
        // 1. VALIDAR USUARIO ACTIVO Y APLICAR COLOR
        const activeProfileId = localStorage.getItem('active_profile_id');
        if(!activeProfileId) {
            window.location.href = 'index.html';
        }

        const profiles = JSON.parse(localStorage.getItem('app_profiles')) || [];
        const activeProfile = profiles.find(p => p.id === activeProfileId);
        
        if(activeProfile) {
            document.getElementById('userName').innerText = activeProfile.name;
            if (activeProfile.themeColor) {
                document.documentElement.style.setProperty('--primary-color', activeProfile.themeColor);
            }
        } else {
            localStorage.removeItem('active_profile_id');
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem('active_profile_id');
            window.location.href = 'index.html';
        }

        // BASE DE DATOS (IndexedDB) para poder borrar los registros profundamente
        let db;
        const request = indexedDB.open("FitnessDB", 7);
        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("exercises")) db.createObjectStore("exercises", { keyPath: "id" });
            if (!db.objectStoreNames.contains("progress")) db.createObjectStore("progress", { keyPath: "id" });
        };
        request.onsuccess = function(e) { 
            db = e.target.result; 
        };

        // Lista completa de días disponibles
        const allPossibleDays = [
            { id: 'lunes', defaultName: 'Lunes' },
            { id: 'martes', defaultName: 'Martes' },
            { id: 'miercoles', defaultName: 'Miércoles' },
            { id: 'jueves', defaultName: 'Jueves' },
            { id: 'viernes', defaultName: 'Viernes' },
            { id: 'sabado', defaultName: 'Sábado' },
            { id: 'domingo', defaultName: 'Domingo' }
        ];

        // Obtener la configuración guardada de este usuario
        function getUserSchedule() {
            const savedSchedules = JSON.parse(localStorage.getItem('user_schedules')) || {};
            if (savedSchedules[activeProfileId]) {
                return savedSchedules[activeProfileId];
            } else {
                let defaultSched = {};
                allPossibleDays.forEach(d => {
                    defaultSched[d.id] = { active: false, subtitle: '' };
                });
                return defaultSched;
            }
        }

        // 2. RENDERIZAR LA SEMANA DEL USUARIO EN EL DASHBOARD
        function renderUserDashboard() {
            const schedule = getUserSchedule();
            const weekDaysList = document.getElementById('weekDaysList');
            const emptyState = document.getElementById('emptyState');
            weekDaysList.innerHTML = '';

            let activeCount = 0;

            allPossibleDays.forEach(d => {
                const dayConfig = schedule[d.id];
                if (dayConfig && dayConfig.active) {
                    activeCount++;
                    const card = document.createElement('div');
                    card.className = 'day-card';
                    card.onclick = () => {
                        window.location.href = `rutina.html?dia=${d.id}`;
                    };
                    
                    card.innerHTML = `
                        <button class="delete-day-btn" title="Eliminar Día" onclick="deleteDayAndClearData(event, '${d.id}', '${d.defaultName}')">✕</button>
                        <div class="day-info">
                            <h3>${d.defaultName}</h3>
                            <p>${dayConfig.subtitle || 'TOCA PARA VER RUTINA'}</p>
                        </div>
                        <div class="day-action">→</div>
                    `;
                    weekDaysList.appendChild(card);
                }
            });

            if (activeCount === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }
        }

        // FUNCION PRINCIPAL DE BORRADO DE BASE DE DATOS
        function deleteDayAndClearData(event, dayId, dayName) {
            if (event) event.stopPropagation(); // Evitar que el clic abra la rutina

            if (confirm(`¿Estás seguro de eliminar el ${dayName}?\n\n⚠️ SE BORRARÁN TODOS LOS EJERCICIOS configurados en este día para dejarlo en blanco.`)) {
                
                // 1. Borrar datos físicos de IndexedDB
                if (db) {
                    const tx = db.transaction("exercises", "readwrite");
                    const store = tx.objectStore("exercises");
                    const req = store.getAll();
                    
                    req.onsuccess = function() {
                        const allExercises = req.result;
                        allExercises.forEach(ex => {
                            if(ex.userId === activeProfileId && ex.day === dayId) {
                                store.delete(ex.id);
                            }
                        });
                    };

                    tx.oncomplete = function() {
                        // 2. Desactivar el día en el LocalStorage
                        removeDayFromUI(dayId);
                    };
                } else {
                    removeDayFromUI(dayId);
                }
            }
        }

        function removeDayFromUI(dayId) {
            const savedSchedules = JSON.parse(localStorage.getItem('user_schedules')) || {};
            if (savedSchedules[activeProfileId] && savedSchedules[activeProfileId][dayId]) {
                savedSchedules[activeProfileId][dayId].active = false; // Lo apaga
                localStorage.setItem('user_schedules', JSON.stringify(savedSchedules));
            }
            renderUserDashboard();
        }

        // 3. FUNCIONES DEL MODAL DE CONFIGURACIÓN
        function openConfigModal() {
            const schedule = getUserSchedule();
            const container = document.getElementById('daysConfigContainer');
            container.innerHTML = '';

            allPossibleDays.forEach(d => {
                const dayConfig = schedule[d.id] || { active: false, subtitle: '' };
                
                const row = document.createElement('div');
                row.className = 'day-config-row';
                row.innerHTML = `
                    <label class="day-config-header">
                        <input type="checkbox" id="chk_${d.id}" ${dayConfig.active ? 'checked' : ''} onchange="toggleDayInput('${d.id}')">
                        ${d.defaultName}
                    </label>
                    <input type="text" id="sub_${d.id}" class="form-control" placeholder="Ej. Upper Body, Natación..." value="${dayConfig.subtitle}" ${dayConfig.active ? '' : 'disabled'}>
                `;
                container.appendChild(row);
            });

            document.getElementById('configModal').style.display = 'flex';
        }

        function toggleDayInput(dayId) {
            const isChecked = document.getElementById(`chk_${dayId}`).checked;
            const inputSub = document.getElementById(`sub_${dayId}`);
            inputSub.disabled = !isChecked;
            if(isChecked && !inputSub.value) {
                const dayObj = allPossibleDays.find(d => d.id === dayId);
                inputSub.value = `TOCA PARA VER RUTINA`;
            }
        }

        function closeConfigModal() {
            document.getElementById('configModal').style.display = 'none';
        }

        // GUARDAR CAMBIOS DEL MODAL Y LIMPIAR DB SI SE DESMARCÓ ALGUNO
        function saveUserSchedule() {
            const oldSchedule = getUserSchedule();
            const schedule = {};
            let requiresDBDelete = [];

            allPossibleDays.forEach(d => {
                const active = document.getElementById(`chk_${d.id}`).checked;
                const subtitle = document.getElementById(`sub_${d.id}`).value.trim();
                schedule[d.id] = { active, subtitle };

                // Si antes estaba activo y ahora lo desmarcaron en el modal, se anota para borrar sus datos
                if (oldSchedule[d.id] && oldSchedule[d.id].active && !active) {
                    requiresDBDelete.push(d.id);
                }
            });

            const savedSchedules = JSON.parse(localStorage.getItem('user_schedules')) || {};
            savedSchedules[activeProfileId] = schedule;
            localStorage.setItem('user_schedules', JSON.stringify(savedSchedules));

            closeConfigModal();
            renderUserDashboard();

            // Borrar de la base de datos los días que se desmarcaron en el modal
            if (requiresDBDelete.length > 0 && db) {
                const tx = db.transaction("exercises", "readwrite");
                const store = tx.objectStore("exercises");
                const req = store.getAll();
                req.onsuccess = function() {
                    const allExercises = req.result;
                    allExercises.forEach(ex => {
                        if(ex.userId === activeProfileId && requiresDBDelete.includes(ex.day)) {
                            store.delete(ex.id);
                        }
                    });
                };
            }
        }

        // Iniciar al cargar
        renderUserDashboard();
    </script>
</body>
</html>
