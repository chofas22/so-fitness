<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Fitness App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

        :root {
            --primary-color: #e87c3e; /* Se actualiza dinámicamente según el perfil */
            --bg-color: #050505;
            --card-inner: #2a2a2a;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            max-width: 450px;
            width: 100%;
        }

        /* Botón superior derecho para cambiar perfil */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .switch-profile-top {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .switch-profile-top:hover {
            text-decoration: underline;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding: 10px 0 15px 0;
            border-bottom: 1px solid #222;
        }

        .header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 5px 0 0 0;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        .section-title {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            margin: 25px 0 15px 0;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* TARJETAS DE DÍAS */
        .days-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .day-card {
            background-color: var(--card-inner);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.05rem;
            text-transform: uppercase;
            transition: transform 0.2s, border-color 0.2s, color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .day-card:hover {
            transform: scale(1.02);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .day-card span {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Botón superior derecho original -->
        <div class="top-bar">
            <a href="index.html" class="switch-profile-top">← Cambiar Perfil</a>
        </div>

        <div class="header">
            <h2>SEMANA DE ENTRENAMIENTO</h2>
            <h1 id="profileHeaderName">USUARIO</h1>
        </div>

        <div class="section-title">Selecciona el día</div>

        <div class="days-grid">
            <a href="rutina.html?dia=lunes" class="day-card">Lunes <span>→</span></a>
            <a href="rutina.html?dia=martes" class="day-card">Martes <span>→</span></a>
            <a href="rutina.html?dia=miercoles" class="day-card">Miércoles <span>→</span></a>
            <a href="rutina.html?dia=jueves" class="day-card">Jueves <span>→</span></a>
            <a href="rutina.html?dia=viernes" class="day-card">Viernes <span>→</span></a>
            <a href="rutina.html?dia=sabado" class="day-card">Sábado <span>→</span></a>
            <a href="rutina.html?dia=domingo" class="day-card">Domingo <span>→</span></a>
        </div>
    </div>

    <script>
        const activeProfileId = localStorage.getItem('active_profile_id');
        if (!activeProfileId) {
            window.location.href = 'index.html';
        }

        const profiles = JSON.parse(localStorage.getItem('app_profiles')) || [];
        const activeProfile = profiles.find(p => p.id === activeProfileId);

        if (activeProfile) {
            document.getElementById('profileHeaderName').innerText = activeProfile.name;
            if (activeProfile.themeColor) {
                document.documentElement.style.setProperty('--primary-color', activeProfile.themeColor);
            }
        }
    </script>
</body>
</html>
