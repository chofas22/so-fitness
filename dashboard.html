<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Fitness App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300&display=swap');

        :root {
            --primary-color: #e87c3e;
            --bg-color: #050505;
            --card-bg: #1a1a1a;
            --card-inner: #2a2a2a;
        }

        body { background-color: var(--bg-color); color: #ffffff; font-family: 'Montserrat', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { max-width: 450px; width: 100%; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .header-info h2 { font-size: 0.9rem; font-weight: 400; margin: 0; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .header-info h1 { font-size: 1.8rem; font-weight: 800; margin: 2px 0 0 0; color: var(--primary-color); text-transform: uppercase; }
        
        .btn-profile { background: none; border: 1px solid #444; color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.2s; }
        .btn-profile:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .btn-profile svg { width: 20px; height: 20px; fill: currentColor; }

        .section-title { font-size: 1rem; font-weight: 700; color: #fff; text-transform: uppercase; border-left: 4px solid var(--primary-color); padding-left: 10px; margin: 25px 0 15px 0; letter-spacing: 0.5px; }

        /* Filtro de Días */
        .days-filter-container { background-color: var(--card-bg); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 25px; }
        .days-filter-title { font-size: 0.8rem; color: var(--primary-color); font-weight: 700; text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;}
        .days-grid-checkboxes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .day-checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: #ccc; cursor: pointer; padding: 6px; border-radius: 6px; transition: background 0.2s; }
        .day-checkbox-label:hover { background-color: #222; color: #fff; }
        .day-checkbox-label input { accent-color: var(--primary-color); width: 16px; height: 16px; cursor: pointer; }

        /* Tarjetas de Días */
        .active-days-grid { display: flex; flex-direction: column; gap: 12px; }
        .day-card { background-color: var(--card-bg); border: 1px solid #333; border-radius: 12px; padding: 20px; cursor: pointer; position: relative; transition: transform 0.2s, border-color 0.2s; overflow: hidden; display: flex; justify-content: space-between; align-items: center; }
        .day-card:hover { border-color: var(--primary-color); transform: translateY(-2px); }
        .day-card-content h3 { margin: 0; font-size: 1.3rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .day-card-content p { margin: 4px 0 0 0; font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: 600; }
        .day-card-arrow { color: var(--primary-color); font-weight: 800; font-size: 1.2rem; }
        
        /* Botón X para eliminar el día */
        .delete-day-btn { position: absolute; top: 10px; right: 10px; background-color: rgba(255, 50, 50, 0.1); border: 1px solid rgba(255, 50, 50, 0.3); color: #ff4444; width: 28px; height: 28px; border-radius: 50%; font-size: 0.9rem; font-weight: 800; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; z-index: 10; padding: 0; }
        .delete-day-btn:hover { background-color: #ff4444; color: #fff; border-color: #ff4444; transform: scale(1.1); }

        .empty-state { text-align: center; padding: 30px 15px; background-color: var(--card-bg); border: 1px dashed #444; border-radius: 12px; color: #888; font-size: 0.9rem; font-weight: 600; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="header">
            <div class="header-info">
                <h2>Bienvenido</h2>
                <h1 id="profileNameDisplay">Usuario</h1>
            </div>
            <button class="btn-profile" onclick="window.location.href='index.html'" title="Cambiar Perfil">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </button>
        </div>

        <div class="days-filter-container">
            <div class="days-filter-title">
                Administrar Semana
                <span style="font-size: 0.7rem; color: #888; font-weight: normal;">Marca para agregar</span>
            </div>
            <div class="days-grid-checkboxes" id="daysCheckboxesContainer">
                <!-- Se generan desde JS -->
            </div>
        </div>

        <h3 class="section-title">Tus Rutinas</h3>
        <div class="active-days-grid" id="activeDaysContainer">
            <!-- Tarjetas de los días activos se generan aquí -->
        </div>

    </div>

    <script>
        // Inicialización de datos del usuario
        const activeProfileId = localStorage.getItem('active_profile_id');
        if (!activeProfileId) { window.location.href = 'index.html'; }
        
        let profiles = JSON.parse(localStorage.getItem('app_profiles')) || [];
        let activeProfile = profiles.find(p => p.id === activeProfileId);
        
        if (activeProfile) {
            document.getElementById('profileNameDisplay').innerText = activeProfile.name;
            if (activeProfile.themeColor) {
                document.documentElement.style.setProperty('--primary-color', activeProfile.themeColor);
            }
            if (!activeProfile.activeDays) {
                activeProfile.activeDays = [];
            }
        }

        const allDays = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
        const dayNames = { lunes: 'Lunes', martes: 'Martes', miercoles: 'Miércoles', jueves: 'Jueves', viernes: 'Viernes', sabado: 'Sábado', domingo: 'Domingo' };

        // Base de Datos para poder borrar los ejercicios al eliminar un día
        let db;
        const request = indexedDB.open("FitnessDB", 7);
        request.onupgradeneeded = function(e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("exercises")) db.createObjectStore("exercises", { keyPath: "id" });
            if (!db.objectStoreNames.contains("progress")) db.createObjectStore("progress", { keyPath: "id" });
        };
        request.onsuccess = function(e) { 
            db = e.target.result; 
        };

        // Renderizar checkboxes de la semana
        function renderCheckboxes() {
            const container = document.getElementById('daysCheckboxesContainer');
            container.innerHTML = '';
            
            allDays.forEach(day => {
                const label = document.createElement('label');
                label.className = 'day-checkbox-label';
                
                const isChecked = activeProfile.activeDays.includes(day);
                
                label.innerHTML = `
                    <input type="checkbox" value="${day}" ${isChecked ? 'checked' : ''} onchange="toggleDay(this)">
                    ${dayNames[day]}
                `;
                container.appendChild(label);
            });
        }

        // Renderizar las tarjetas de los días activos
        function renderActiveDays() {
            const container = document.getElementById('activeDaysContainer');
            container.innerHTML = '';

            // Ordenar los días activos basándonos en su orden natural en la semana
            const sortedActiveDays = activeProfile.activeDays.sort((a, b) => allDays.indexOf(a) - allDays.indexOf(b));

            if (sortedActiveDays.length === 0) {
                container.innerHTML = `<div class="empty-state">No tienes días activos.<br><span style="font-size:0.75rem; font-weight:400; margin-top:5px; display:block;">Selecciona los días en el panel superior para comenzar.</span></div>`;
                return;
            }

            sortedActiveDays.forEach(day => {
                const card = document.createElement('div');
                card.className = 'day-card';
                // Al hacer clic en la tarjeta, vamos a la rutina
                card.onclick = function() { window.location.href = `rutina.html?dia=${day}`; };
                
                card.innerHTML = `
                    <div class="day-card-content">
                        <h3>${dayNames[day]}</h3>
                        <p>Toca para ver rutina</p>
                    </div>
                    <div class="day-card-arrow">→</div>
                    <!-- Botón de eliminación profunda con la X -->
                    <button class="delete-day-btn" title="Eliminar Día" onclick="deleteDayAndClearData(event, '${day}')">✕</button>
                `;
                container.appendChild(card);
            });
        }

        // Función original para agregar o quitar el día desde el Checkbox
        function toggleDay(checkboxElement) {
            const day = checkboxElement.value;
            if (checkboxElement.checked) {
                if (!activeProfile.activeDays.includes(day)) {
                    activeProfile.activeDays.push(day);
                }
                saveProfileData();
                renderActiveDays();
            } else {
                // Si lo desmarca desde el checkbox, también lanzamos la limpieza profunda
                checkboxElement.checked = true; // Lo revertimos momentáneamente para que la alerta controle la acción
                deleteDayAndClearData(null, day, checkboxElement);
            }
        }

        // FUNCIÓN PRINCIPAL: Elimina la tarjeta, desmarca el checkbox y BORRA la base de datos
        function deleteDayAndClearData(event, dayToDelete, checkboxElementRef = null) {
            if (event) event.stopPropagation(); // Evitar que el clic en la X abra `rutina.html`

            if (confirm(`¿Estás seguro de eliminar el ${dayNames[dayToDelete]}?\n\n⚠️ ESTO BORRARÁ TODOS LOS EJERCICIOS que hayas configurado en este día para dejarlos en blanco.`)) {
                
                // 1. Borrar datos físicos de IndexedDB
                if (db) {
                    const tx = db.transaction("exercises", "readwrite");
                    const store = tx.objectStore("exercises");
                    const req = store.getAll();
                    
                    req.onsuccess = function() {
                        const allExercises = req.result;
                        allExercises.forEach(ex => {
                            // Si el ejercicio le pertenece a este perfil y a este día, ¡Bórralo!
                            if(ex.userId === activeProfileId && ex.day === dayToDelete) {
                                store.delete(ex.id);
                            }
                        });
                    };

                    tx.oncomplete = function() {
                        // 2. Una vez borrados los datos, quitamos el día del perfil
                        removeDayFromUI(dayToDelete);
                    };
                } else {
                    // Si por alguna razón la BD no cargó rápido, solo ocultamos la UI
                    removeDayFromUI(dayToDelete);
                }
            } else {
                // Si el usuario cancela y vino desde un checkbox, lo dejamos marcado
                if (checkboxElementRef) {
                    checkboxElementRef.checked = true;
                }
            }
        }

        // Función de apoyo para actualizar la interfaz después de borrar
        function removeDayFromUI(dayToDelete) {
            activeProfile.activeDays = activeProfile.activeDays.filter(d => d !== dayToDelete);
            saveProfileData();
            renderCheckboxes(); // Actualiza visualmente el checkbox quitándole la paloma
            renderActiveDays(); // Quita la tarjeta de la lista
        }

        // Guarda en LocalStorage
        function saveProfileData() {
            const profileIndex = profiles.findIndex(p => p.id === activeProfileId);
            if (profileIndex !== -1) {
                profiles[profileIndex] = activeProfile;
                localStorage.setItem('app_profiles', JSON.stringify(profiles));
            }
        }

        // Inicializar vistas
        renderCheckboxes();
        renderActiveDays();

    </script>
</body>
</html>
